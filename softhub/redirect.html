<!-- SoftHub — redirect / exit page -->
<!-- promt by @mopscode -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ссылка — SoftHub</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  :root {
    --bg: #050506; --panel: #0e0e10; --panel-2: #141416;
    --border: #1c1c1f; --border-hi: #26262a;
    --red: #ff2b3b; --text: #f0f0f2;
    --text-dim: #8a8a92; --text-dimmer: #5a5a62;
  }
  html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", system-ui, sans-serif; min-height: 100vh; line-height: 1.5; display: flex; flex-direction: column; }
  a { color: inherit; text-decoration: none; }

  header { position: sticky; top: 0; z-index: 100; background: rgba(5,5,6,0.85); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
  .head-inner { max-width: 1200px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .logo {
    font-size: 22px; font-weight: 900; letter-spacing: -0.5px;
    display: flex; align-items: center;
    background: linear-gradient(90deg, #ffffff 0%, #ff2b3b 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .logo .soft,
  .logo .hub { color: transparent; }

  @keyframes softhubFlow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 50px 20px; }
  .card { max-width: 560px; width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 36px 30px; }
  .card-head { text-align: center; margin-bottom: 28px; }
  .card-icon { width: 56px; height: 56px; margin: 0 auto 18px; background: var(--red); border-radius: 15px; display: flex; align-items: center; justify-content: center; }
  .card-icon svg { width: 28px; height: 28px; fill: #000; }
  .card h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.4px; margin-bottom: 8px; }
  .card .sub { font-size: 13.5px; color: var(--text-dim); }

  .link-box { background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 22px; }
  .link-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--red); margin-bottom: 6px; }
  .link-url { font-size: 13.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text-dim); word-break: break-all; line-height: 1.5; }

  .btn-row { display: flex; flex-direction: column; gap: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px 24px; border-radius: 12px; font-weight: 700; font-size: 15px; transition: all .18s ease; cursor: pointer; border: none; text-align: center; }
  .btn-go { background: var(--red); color: #000; }
  .btn-go:hover { background: #ff4150; box-shadow: 0 0 28px rgba(255,43,59,0.55); transform: translateY(-1px); }
  .btn-copy { background: transparent; color: var(--text); border: 1px solid var(--border-hi); }
  .btn-copy:hover { border-color: var(--red); color: var(--red); }
  .btn-copy.copied { border-color: #2ecc71; color: #2ecc71; }

  .note { margin-top: 22px; font-size: 12px; color: var(--text-dimmer); text-align: center; line-height: 1.6; }
  .note a { color: var(--text-dim); border-bottom: 1px dashed var(--border-hi); }
  .note a:hover { color: var(--red); border-bottom-style: solid; }

  .error { padding: 20px; text-align: center; color: var(--red); font-size: 14px; }

  footer { border-top: 1px solid var(--border); padding: 22px 20px; }
  .footer-inner { max-width: 1200px; margin: 0 auto; font-size: 13px; color: var(--text-dimmer); text-align: center; }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <a href="index.html" class="logo"><span class="soft">Soft</span><span class="hub">Hub</span></a>
  </div>
</header>

<main>
  <div class="card">

    <div class="card-head">
      <div class="card-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-2h2v2h-2zm1.07-3.75l-.07.05v.7h-2v-1.2l1.07-1.13c.62-.63 1.04-1.05 1.04-1.67 0-.7-.62-1.2-1.5-1.2-.86 0-1.4.53-1.5 1.4l-1.98-.2c.15-1.9 1.66-3.1 3.48-3.1 1.9 0 3.5 1.13 3.5 3.1 0 1.4-1.05 2.1-2.04 3.05z"/></svg>
      </div>
      <h1 id="cheat-name">Ссылка на скачивание</h1>
      <div class="sub">Ты переходишь на внешний ресурс</div>
    </div>

    <div class="link-box">
      <div class="link-label">Ссылка</div>
      <div class="link-url" id="cheat-url">—</div>
    </div>

    <div class="btn-row">
      <a href="#" id="go-btn" class="btn btn-go" target="_blank" rel="noopener noreferrer">Перейти к скачиванию</a>
      <button type="button" id="copy-btn" class="btn btn-copy">Скопировать ссылку</button>
    </div>

    <p class="note">
      Внешний ресурс. SoftHub не отвечает за содержимое ссылки.<br>
      <a href="index.html">← Вернуться на главную</a>
    </p>

  </div>
</main>

<footer>
  <div class="footer-inner">Soft<span style="color:#ff2b3b;font-weight:900">Hub</span> · © 2026</div>
</footer>

<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var url = params.get('u') || '';
    var name = params.get('n') || 'Ссылка на скачивание';

    var nameEl = document.getElementById('cheat-name');
    var urlEl = document.getElementById('cheat-url');
    var goBtn = document.getElementById('go-btn');
    var copyBtn = document.getElementById('copy-btn');

    if (!url) {
      nameEl.textContent = 'Ссылка не указана';
      urlEl.textContent = 'Ничего не передано в параметре u.';
      goBtn.style.opacity = '0.4';
      goBtn.style.pointerEvents = 'none';
      copyBtn.style.opacity = '0.4';
      copyBtn.style.pointerEvents = 'none';
      return;
    }

    nameEl.textContent = name;
    urlEl.textContent = url;
    goBtn.href = url;

    copyBtn.addEventListener('click', function () {
      var originalText = copyBtn.textContent;
      var showCopied = function () {
        copyBtn.textContent = '✓ Скопировано';
        copyBtn.classList.add('copied');
        setTimeout(function () {
          copyBtn.textContent = originalText;
          copyBtn.classList.remove('copied');
        }, 1800);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(showCopied, function () {
          fallbackCopy(url, showCopied);
        });
      } else {
        fallbackCopy(url, showCopied);
      }
    });

    function fallbackCopy(text, cb) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); cb(); } catch (e) {}
      document.body.removeChild(ta);
    }
  })();
</script>

</body>
</html>
