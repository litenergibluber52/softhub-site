<!-- FlyxHub — redirect / exit page -->
<!-- promt by @mopscode -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ссылка — FlyxHub</title>

<link rel="icon" href="favicon.png" type="image/png">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  :root {
    --bg: #06060a;
    --panel: #0e0e14; --panel-2: #141420; --panel-3: #1a1a26;
    --border: #1e1e2a; --border-hi: #2a2a3a;
    --red: #ff2b3b;
    --text: #f4f4f8; --text-dim: #8c8c9a; --text-dimmer: #5a5a68;
  }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", system-ui, sans-serif;
    min-height: 100vh; line-height: 1.5;
    display: flex;
    flex-direction: column;
    width: 100%;
  }
  a { color: inherit; text-decoration: none; }

-- promt by @mopscode
  header {
    position: sticky; top: 0; z-index: 100;
    flex-shrink: 0;
    background: rgba(6,6,10,0.72);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border-bottom: 1px solid rgba(30,30,42,0.6);
  }
  .head-inner {
    max-width: 1180px; margin: 0 auto; padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .logo {
    font-size: 22px; font-weight: 900; letter-spacing: -0.5px;
    display: flex; align-items: center;
    background: linear-gradient(120deg, #ffffff 0%, #ff6b78 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    transition: filter .3s ease;
  }
  .logo:hover { filter: drop-shadow(0 0 20px rgba(255,43,59,0.55)); }
  .head-nav { display: flex; align-items: center; gap: 30px; font-size: 14px; color: var(--text-dim); }
  .head-nav a { position: relative; transition: color .25s ease; }
  .head-nav a:hover { color: var(--text); }
  .head-nav a::after {
    content: ""; position: absolute; left: 0; bottom: -6px;
    width: 0; height: 1px; background: var(--red);
    transition: width .3s ease;
  }
  .head-nav a:hover::after { width: 100%; }
  .head-icons { display: flex; align-items: center; gap: 18px; color: var(--text-dim); }
  .head-icons a { display: flex; align-items: center; transition: color .25s ease, transform .25s ease; }
  .head-icons a:hover { color: var(--red); transform: scale(1.1); }
  .head-icons svg { width: 20px; height: 20px; }

-- promt by @mopscode
  main {
    flex: 1 0 auto;
    width: 100%;
    position: relative;
    padding: 200px 20px 200px;
  }
  main::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,43,59,0.20), rgba(255,43,59,0.06) 40%, transparent 75%);
    pointer-events: none;
    z-index: 0;
  }

  .page-wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
  }

  .card {
    width: 100%;
    background: linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
    border: 1px solid rgba(255,43,59,0.35);
    border-radius: 20px;
    padding: 40px 32px;
    text-align: center;
    transition: border-color .4s ease, box-shadow .4s ease;
  }
  .card:hover {
    border-color: rgba(255,43,59,0.6);
    box-shadow: 0 22px 50px -22px rgba(255,43,59,0.35);
  }

  .card-head { text-align: center; margin-bottom: 30px; }
  .card-icon {
    width: 64px; height: 64px; margin: 0 auto 20px;
    background: linear-gradient(135deg, var(--red) 0%, #d92335 100%);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    box-shadow: 0 12px 30px -12px rgba(255,43,59,0.7);
    transition: width .35s cubic-bezier(0.16, 1, 0.3, 1),
                height .35s cubic-bezier(0.16, 1, 0.3, 1),
                border-radius .35s ease,
                box-shadow .35s ease;
  }
  .card-icon svg { width: 32px; height: 32px; fill: #000; }
  .card-icon.has-image {
    width: 100%; height: 200px;
    background: var(--panel-3);
    border-radius: 14px;
    border: 1px solid rgba(255,43,59,0.35);
    box-shadow: 0 15px 40px -15px rgba(0,0,0,0.8);
    cursor: zoom-in;
  }
  .card-icon.has-image:hover {
    border-color: rgba(255,43,59,0.85);
    box-shadow: 0 20px 50px -18px rgba(255,43,59,0.55);
  }
  .card-image { width: 100%; height: 100%; object-fit: cover; display: block; }

  .card h1 {
    font-size: 24px; font-weight: 900; letter-spacing: -0.5px;
    margin-bottom: 10px;
    background: linear-gradient(180deg, #ffffff 0%, #c8c8d2 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .card .sub { font-size: 13.5px; color: var(--text-dim); }

  .btn-row { display: flex; flex-direction: column; gap: 12px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 16px 24px; border-radius: 14px;
    font-weight: 700; font-size: 15px;
    transition: all .35s cubic-bezier(0.16, 1, 0.3, 1);
    cursor: pointer; border: none; text-align: center;
    white-space: nowrap; position: relative;
  }
  .btn-go {
    background: linear-gradient(135deg, var(--red) 0%, #d92335 100%);
    color: #fff;
    box-shadow: 0 12px 30px -12px rgba(255,43,59,0.7);
  }
  .btn-go:hover {
    transform: translateY(-2px);
    box-shadow: 0 18px 45px -14px rgba(255,43,59,0.9);
    filter: brightness(1.08);
  }

  .note {
    margin-top: 26px;
    font-size: 12.5px; color: var(--text-dimmer);
    text-align: center; line-height: 1.7;
  }
  .note a {
    color: var(--text-dim);
    border-bottom: 1px dashed var(--border-hi);
    transition: color .25s ease, border-color .25s ease;
  }
  .note a:hover {
    color: var(--red);
    border-bottom-color: var(--red);
    border-bottom-style: solid;
  }

-- promt by @mopscode
  footer {
    flex-shrink: 0;
    width: 100%;
    border-top: 1px solid rgba(30,30,42,0.8);
    padding: 40px 24px 32px;
    background: linear-gradient(180deg, rgba(10,10,18,0) 0%, rgba(10,10,18,0.6) 100%);
    position: relative;
    z-index: 1;
  }
  footer::before {
    content: ""; position: absolute; top: -1px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
  }
  .footer-inner {
    max-width: 1180px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    gap: 24px; flex-wrap: wrap;
  }
  .footer-left {
    font-size: 13px; color: var(--text-dimmer);
    display: flex; flex-direction: column; gap: 6px;
  }
  .footer-left .brand { font-weight: 900; font-size: 18px; letter-spacing: -0.5px; }
  .footer-left .copy { font-size: 12.5px; }
  .footer-links {
    display: flex; gap: 28px; font-size: 14px;
    color: var(--text-dim); align-items: center; flex-wrap: wrap;
  }
  .footer-links a {
    position: relative; transition: color .25s ease;
    padding: 4px 0; cursor: pointer;
  }
  .footer-links a::after {
    content: ""; position: absolute; left: 0; bottom: 0;
    width: 0; height: 1px; background: var(--red);
    transition: width .3s ease;
  }
  .footer-links a:hover { color: var(--red); }
  .footer-links a:hover::after { width: 100%; }

-- promt by @mopscode
  .lightbox {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    padding: 30px;
    background: rgba(6, 6, 10, 0.75);
    backdrop-filter: blur(16px) saturate(120%);
    -webkit-backdrop-filter: blur(16px) saturate(120%);
    opacity: 0; visibility: hidden;
    transition: opacity .25s ease, visibility .25s ease;
    cursor: zoom-out;
  }
  .lightbox.open { opacity: 1; visibility: visible; }
  .lightbox img {
    max-width: 92vw; max-height: 92vh;
    border-radius: 16px;
    border: 1px solid rgba(255,43,59,0.5);
    box-shadow: 0 30px 90px -25px rgba(255,43,59,0.45), 0 30px 90px -25px rgba(0,0,0,0.95);
    object-fit: contain;
    transform: scale(0.94);
    transition: transform .3s cubic-bezier(0.16, 1, 0.3, 1);
    cursor: zoom-out;
  }
  .lightbox.open img { transform: scale(1); }
</style>
</head>
<body>

  <header>
    <div class="head-inner">
      <a href="index.html" class="logo"><span class="soft">Flyx</span><span class="hub">Hub</span></a>
      <nav class="head-nav">
        <a href="contact.html">Связь</a>
        <a href="index.html#faq">FAQ</a>
      </nav>
      <div class="head-icons">
        <a href="https://youtube.com/@xiwedzec13_37tim" target="_blank" aria-label="YouTube">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.19a3.02 3.02 0 0 0-2.12-2.14C19.5 3.55 12 3.55 12 3.55s-7.5 0-9.38.5A3.02 3.02 0 0 0 .5 6.19C0 8.07 0 12 0 12s0 3.93.5 5.81a3.02 3.02 0 0 0 2.12 2.14c1.88.5 9.38.5 9.38.5s7.5 0 9.38-.5a3.02 3.02 0 0 0 2.12-2.14C24 15.93 24 12 24 12s0-3.93-.5-5.81zM9.55 15.57V8.43L15.82 12l-6.27 3.57z"/></svg>
        </a>
      </div>
    </div>
  </header>

  <main>
    <div class="page-wrap">
      <div class="card">

        <div class="card-head">
          <div class="card-icon" id="card-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-2h2v2h-2zm1.07-3.75l-.07.05v.7h-2v-1.2l1.07-1.13c.62-.63 1.04-1.05 1.04-1.67 0-.7-.62-1.2-1.5-1.2-.86 0-1.4.53-1.5 1.4l-1.98-.2c.15-1.9 1.66-3.1 3.48-3.1 1.9 0 3.5 1.13 3.5 3.1 0 1.4-1.05 2.1-2.04 3.05z"/></svg>
          </div>
          <h1 id="cheat-name">Ссылка на скачивание</h1>
          <div class="sub">Ты переходишь на внешний ресурс</div>
        </div>

        <div class="btn-row">
          <a href="#" id="go-btn" class="btn btn-go" target="_blank" rel="noopener noreferrer">Перейти к скачиванию</a>
        </div>

        <p class="note">
          Внешний ресурс. FlyxHub не отвечает за содержимое ссылки.<br>
          <a href="index.html">← Вернуться на главную</a>
        </p>

      </div>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <div class="footer-left">
        <span class="brand">Flyx<span style="color:#ff2b3b">Hub</span></span>
        <span class="copy">© 2026 — читы для популярных игр</span>
      </div>
      <div class="footer-links">
        <a href="contact.html">Связь</a>
        <a href="https://youtube.com/@xiwedzec13_37tim" target="_blank">YouTube</a>
      </div>
    </div>
  </footer>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <img id="lightbox-img" src="" alt="">
  </div>

<script>
// promt by @mopscode
  (function () {
    var params = new URLSearchParams(window.location.search);
    var url  = params.get('u') || '';
    var name = params.get('n') || 'Ссылка на скачивание';
    var img  = params.get('i') || '';
    var back = params.get('b') || 'index.html';

    var nameEl = document.getElementById('cheat-name');
    var goBtn  = document.getElementById('go-btn');
    var iconEl = document.getElementById('card-icon');
    var lb     = document.getElementById('lightbox');
    var lbImg  = document.getElementById('lightbox-img');

    function openLightbox() {
      if (!img) return;
      lbImg.src = img;
      lb.classList.add('open');
      lb.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lb.classList.remove('open');
      lb.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    lb.addEventListener('click', closeLightbox);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeLightbox();
    });

    if (img) {
      iconEl.classList.add('has-image');
      iconEl.innerHTML = '';
      var im = document.createElement('img');
      im.className = 'card-image';
      im.alt = '';
      im.onerror = function () {
        iconEl.classList.remove('has-image');
        iconEl.style.cursor = '';
        iconEl.onclick = null;
        iconEl.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-2h2v2h-2zm1.07-3.75l-.07.05v.7h-2v-1.2l1.07-1.13c.62-.63 1.04-1.05 1.04-1.67 0-.7-.62-1.2-1.5-1.2-.86 0-1.4.53-1.5 1.4l-1.98-.2c.15-1.9 1.66-3.1 3.48-3.1 1.9 0 3.5 1.13 3.5 3.1 0 1.4-1.05 2.1-2.04 3.05z"/></svg>';
      };
      im.src = img;
      iconEl.appendChild(im);
      iconEl.addEventListener('click', openLightbox);
    }

    var backLink = document.querySelector('.note a[href="index.html"]');
    if (backLink) backLink.href = back;

    if (!url) {
      nameEl.textContent = 'Ссылка не указана';
      goBtn.style.opacity = '0.4';
      goBtn.style.pointerEvents = 'none';
      return;
    }

    nameEl.textContent = name;
    goBtn.href = url;
  })();
</script>

</body>
</html>
