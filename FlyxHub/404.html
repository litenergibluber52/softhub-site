<!-- FlyxHub — 404 page -->
<!-- promt by @mopscode -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — страница не найдена | FlyxHub</title>

<link rel="icon" href="favicon.png" type="image/png">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  :root {
    --bg: #06060a;
    --panel: #0e0e14; --panel-2: #141420; --panel-3: #1a1a26;
    --border: #1e1e2a; --border-hi: #2a2a3a;
    --red: #ff2b3b;
    --text: #f4f4f8; --text-dim: #8c8c9a; --text-dimmer: #5a5a68;
  }
  html {
    scroll-behavior: smooth;
    background: var(--bg);
    min-height: 100%;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", system-ui, sans-serif;
    min-height: 100vh; line-height: 1.5;
    overflow-x: hidden;
    display: block;
    position: relative;
  }
  a { color: inherit; text-decoration: none; }

-- promt by @mopscode
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(6,6,10,0.72);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border-bottom: 1px solid rgba(30,30,42,0.6);
    width: 100%;
  }
  .head-inner {
    max-width: 1180px; margin: 0 auto; padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .logo {
    font-size: 22px; font-weight: 900; letter-spacing: -0.5px;
    display: flex; align-items: center;
    background: linear-gradient(120deg, #ffffff 0%, #ff6b78 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    transition: filter .3s ease;
  }
  .logo:hover { filter: drop-shadow(0 0 20px rgba(255,43,59,0.55)); }
  .head-nav { display: flex; align-items: center; gap: 30px; font-size: 14px; color: var(--text-dim); }
  .head-nav a { position: relative; transition: color .25s ease; }
  .head-nav a:hover { color: var(--text); }
  .head-nav a::after {
    content: ""; position: absolute; left: 0; bottom: -6px;
    width: 0; height: 1px; background: var(--red);
    transition: width .3s ease;
  }
  .head-nav a:hover::after { width: 100%; }
  .head-icons { display: flex; align-items: center; gap: 18px; color: var(--text-dim); }
  .head-icons a { display: flex; align-items: center; transition: color .25s ease, transform .25s ease; }
  .head-icons a:hover { color: var(--red); transform: scale(1.1); }
  .head-icons svg { width: 20px; height: 20px; }

-- promt by @mopscode
  main {
    width: 100%;
    min-height: calc(100vh - 200px);
    position: relative;
    padding: 80px 20px;
    text-align: center;
  }
  main::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,43,59,0.20), rgba(255,43,59,0.06) 40%, transparent 75%);
    pointer-events: none;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    display: inline-block;
    text-align: center;
    width: 100%;
    max-width: 520px;
    background: linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
    border: 1px solid rgba(255,43,59,0.35);
    border-radius: 20px;
    padding: 48px 34px;
    vertical-align: middle;
    transition: border-color .4s ease, box-shadow .4s ease;
  }
  main::after {
    content: ""; display: inline-block;
    height: 100%; vertical-align: middle;
  }
  .card:hover {
    border-color: rgba(255,43,59,0.6);
    box-shadow: 0 22px 50px -22px rgba(255,43,59,0.35);
  }

  .err-code {
    font-size: clamp(72px, 14vw, 120px);
    font-weight: 900; line-height: 1; letter-spacing: -4px;
    background: linear-gradient(180deg, #ffffff 0%, #ff2b3b 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    margin-bottom: 18px;
    filter: drop-shadow(0 0 30px rgba(255,43,59,0.35));
  }
  .card h1 {
    font-size: 22px; font-weight: 900; letter-spacing: -0.4px;
    margin-bottom: 12px;
    background: linear-gradient(180deg, #ffffff 0%, #c8c8d2 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .card p {
    font-size: 14.5px; color: var(--text-dim); margin-bottom: 32px;
    line-height: 1.65;
  }

  .btn-row { display: flex; flex-direction: column; gap: 12px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 15px 26px; border-radius: 14px;
    font-weight: 700; font-size: 15px;
    transition: all .35s cubic-bezier(0.16, 1, 0.3, 1);
    cursor: pointer; border: none; text-align: center;
    white-space: nowrap;
  }
  .btn-red {
    background: linear-gradient(135deg, var(--red) 0%, #d92335 100%);
    color: #fff;
    box-shadow: 0 12px 30px -12px rgba(255,43,59,0.7);
  }
  .btn-red:hover {
    transform: translateY(-2px);
    box-shadow: 0 18px 45px -14px rgba(255,43,59,0.9);
    filter: brightness(1.08);
  }
  .btn-ghost {
    background: rgba(14,14,20,0.6);
    color: var(--text);
    border: 1px solid rgba(42,42,58,0.8);
    backdrop-filter: blur(10px);
  }
  .btn-ghost:hover {
    border-color: rgba(255,43,59,0.6);
    color: var(--red);
    transform: translateY(-2px);
    background: rgba(255,43,59,0.06);
  }

-- promt by @mopscode
  footer {
    width: 100%;
    border-top: 1px solid rgba(30,30,42,0.8);
    padding: 40px 24px 32px;
    background: linear-gradient(180deg, rgba(10,10,18,0) 0%, rgba(10,10,18,0.6) 100%);
    position: relative;
    z-index: 1;
  }
  footer::before {
    content: ""; position: absolute; top: -1px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
  }
  .footer-inner {
    max-width: 1180px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    gap: 24px; flex-wrap: wrap;
  }
  .footer-left {
    font-size: 13px; color: var(--text-dimmer);
    display: flex; flex-direction: column; gap: 6px;
  }
  .footer-left .brand { font-weight: 900; font-size: 18px; letter-spacing: -0.5px; }
  .footer-left .copy { font-size: 12.5px; }
  .footer-links {
    display: flex; gap: 28px; font-size: 14px;
    color: var(--text-dim); align-items: center; flex-wrap: wrap;
  }
  .footer-links a {
    position: relative; transition: color .25s ease;
    padding: 4px 0; cursor: pointer;
  }
  .footer-links a::after {
    content: ""; position: absolute; left: 0; bottom: 0;
    width: 0; height: 1px; background: var(--red);
    transition: width .3s ease;
  }
  .footer-links a:hover { color: var(--red); }
  .footer-links a:hover::after { width: 100%; }
</style>
</head>
<body>

  <header>
    <div class="head-inner">
      <a href="/" class="logo"><span class="soft">Flyx</span><span class="hub">Hub</span></a>
      <nav class="head-nav">
        <a href="/contact.html">Связь</a>
        <a href="/#faq">FAQ</a>
      </nav>
      <div class="head-icons">
        <a href="https://youtube.com/@xiwedzec13_37tim" target="_blank" aria-label="YouTube">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.19a3.02 3.02 0 0 0-2.12-2.14C19.5 3.55 12 3.55 12 3.55s-7.5 0-9.38.5A3.02 3.02 0 0 0 .5 6.19C0 8.07 0 12 0 12s0 3.93.5 5.81a3.02 3.02 0 0 0 2.12 2.14c1.88.5 9.38.5 9.38.5s7.5 0 9.38-.5a3.02 3.02 0 0 0 2.12-2.14C24 15.93 24 12 24 12s0-3.93-.5-5.81zM9.55 15.57V8.43L15.82 12l-6.27 3.57z"/></svg>
        </a>
      </div>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="err-code">404</div>
      <h1>Страница не найдена</h1>
      <p>Такой страницы нет — может, ссылка битая, может, файл удалили. Жми кнопку и возвращайся туда, где всё работает.</p>
      <div class="btn-row">
        <a href="/" class="btn btn-red">← На главную</a>
        <a href="/contact.html" class="btn btn-ghost">Написать в поддержку</a>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <div class="footer-left">
        <span class="brand">Flyx<span style="color:#ff2b3b">Hub</span></span>
        <span class="copy">© 2026 — читы для популярных игр</span>
      </div>
      <div class="footer-links">
        <a href="/contact.html">Связь</a>
        <a href="https://youtube.com/@xiwedzec13_37tim" target="_blank">YouTube</a>
      </div>
    </div>
  </footer>

</body>
</html>
