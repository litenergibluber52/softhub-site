<!-- FlyxHub — 404 page -->
<!-- promt by @mopscode -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — страница не найдена | FlyxHub</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  :root {
    --bg: #050506; --panel: #0e0e10; --panel-2: #141416;
    --border: #1c1c1f; --border-hi: #26262a;
    --red: #ff2b3b; --text: #f0f0f2;
    --text-dim: #8a8a92; --text-dimmer: #5a5a62;
  }
  html, body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", system-ui, sans-serif;
    min-height: 100vh; line-height: 1.5;
    display: flex; flex-direction: column;
  }
  a { color: inherit; text-decoration: none; }

  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(5,5,6,0.85);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .head-inner {
    max-width: 1200px; margin: 0 auto; padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .logo {
    font-size: 22px; font-weight: 900; letter-spacing: -0.5px;
    display: flex; align-items: center;
    background: linear-gradient(90deg, #ffffff 0%, #ff2b3b 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .logo .soft, .logo .hub { color: transparent; }
  .head-nav { display: flex; align-items: center; gap: 26px; font-size: 14px; color: var(--text-dim); }
  .head-nav a:hover { color: var(--text); transition: color .18s; }

  main {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 60px 20px;
  }
  .card {
    max-width: 520px; width: 100%;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 20px; padding: 48px 34px;
    text-align: center;
  }
  .err-code {
    font-size: clamp(72px, 14vw, 120px);
    font-weight: 900; line-height: 1; letter-spacing: -4px;
    background: linear-gradient(180deg, #ffffff 0%, #ff2b3b 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    margin-bottom: 16px;
  }
  .card h1 {
    font-size: 22px; font-weight: 900; letter-spacing: -0.4px;
    margin-bottom: 10px;
  }
  .card p {
    font-size: 14.5px; color: var(--text-dim); margin-bottom: 30px;
    line-height: 1.6;
  }
  .btn-row { display: flex; flex-direction: column; gap: 10px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 15px 24px; border-radius: 12px;
    font-weight: 700; font-size: 15px;
    transition: all .18s ease; cursor: pointer;
    border: none; text-align: center;
  }
  .btn-red { background: var(--red); color: #000; }
  .btn-red:hover {
    background: #ff4150;
    box-shadow: 0 0 28px rgba(255,43,59,0.55);
    transform: translateY(-1px);
  }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border-hi); }
  .btn-ghost:hover { border-color: var(--red); color: var(--red); transform: translateY(-1px); }

  footer { border-top: 1px solid var(--border); padding: 22px 20px; }
  .footer-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
    font-size: 13px; color: var(--text-dimmer);
  }
  .footer-inner .brand { font-weight: 900; color: var(--text); }
  .footer-inner .brand span { color: var(--red); }
  .footer-links { display: flex; gap: 22px; }
  .footer-links a:hover { color: var(--red); transition: color .18s; }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <a href="/" class="logo"><span class="soft">Flyx</span><span class="hub">Hub</span></a>
    <nav class="head-nav">
      <a href="/contact.html">Связь</a>
      <a href="/#faq">FAQ</a>
    </nav>
  </div>
</header>

<main>
  <div class="card">
    <div class="err-code">404</div>
    <h1>Страница не найдена</h1>
    <p>Такой страницы нет — может, ссылка битая, может, файл удалили. Жми кнопку и возвращайся туда, где всё работает.</p>
    <div class="btn-row">
      <a href="/" class="btn btn-red">← На главную</a>
      <a href="/contact.html" class="btn btn-ghost">Написать в поддержку</a>
    </div>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <span class="brand">Flyx<span>Hub</span></span>
    <div class="footer-links">
      <a href="/contact.html">Связь</a>
      <a href="https://youtube.com/@xiwedzec13_37tim" target="_blank">YouTube</a>
    </div>
  </div>
</footer>

</body>
</html>
